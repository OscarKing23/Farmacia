<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto — Farmacia</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <span class="brand-icon">💊</span> Farmacia
        </a>
        <button class="navbar-toggle"
            onclick="document.querySelector('.navbar-links').classList.toggle('open')">☰</button>
        <ul class="navbar-links">
            <li><a href="index.html">🏠 Inicio</a></li>
            <li><a href="productos.html" class="active">📦 Productos</a></li>
            <li><a href="empleado.html">👥 Empleados</a></li>
        </ul>
        <div class="navbar-actions">
            <a href="productos.html" class="btn btn-secondary btn-sm">← Ver Productos</a>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="page-container">
        <div class="page-header">
            <div>
                <h1>Editar Producto</h1>
                <p class="breadcrumb"><a href="index.html">Inicio</a> / <a href="productos.html">Productos</a> / Editar
                </p>
            </div>
        </div>

        <div class="form-container">
            <form id="form-editar-producto">
                <!-- Section: General Info -->
                <div class="form-section">
                    <div class="form-section-header">
                        <span class="section-icon">📋</span>
                        <h3>Información General</h3>
                    </div>
                    <div class="form-section-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nombre">Nombre *</label>
                                <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
                            </div>
                            <div class="form-group">
                                <label for="marca">Marca</label>
                                <input type="text" id="marca" name="marca" placeholder="Marca">
                            </div>
                            <div class="form-group">
                                <label for="descripcion">Descripción</label>
                                <input type="text" id="descripcion" name="descripcion" placeholder="Descripción">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section: Pharmaceutical -->
                <div class="form-section">
                    <div class="form-section-header">
                        <span class="section-icon">💊</span>
                        <h3>Datos Farmacéuticos</h3>
                    </div>
                    <div class="form-section-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="principio_activo">Principio Activo</label>
                                <input type="text" id="principio_activo" name="principio_activo"
                                    placeholder="Principio activo">
                            </div>
                            <div class="form-group">
                                <label for="concentracion">Concentración</label>
                                <input type="text" id="concentracion" name="concentracion" placeholder="Concentración">
                            </div>
                            <div class="form-group">
                                <label for="presentacion">Presentación</label>
                                <input type="text" id="presentacion" name="presentacion" placeholder="Presentación">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section: Pricing -->
                <div class="form-section">
                    <div class="form-section-header">
                        <span class="section-icon">💰</span>
                        <h3>Precios y Categoría</h3>
                    </div>
                    <div class="form-section-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="precio_compra">Precio de Compra *</label>
                                <input type="number" step="0.01" min="0" id="precio_compra" name="precio_compra"
                                    placeholder="0.00" required>
                            </div>
                            <div class="form-group">
                                <label for="precio_venta">Precio de Venta *</label>
                                <input type="number" step="0.01" min="0" id="precio_venta" name="precio_venta"
                                    placeholder="0.00" required>
                            </div>
                            <div class="form-group">
                                <label for="id_categoria">ID Categoría *</label>
                                <input type="number" min="1" id="id_categoria" name="id_categoria"
                                    placeholder="ID Categoría" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section: Inventory -->
                <div class="form-section">
                    <div class="form-section-header">
                        <span class="section-icon">📦</span>
                        <h3>Control de Inventario</h3>
                    </div>
                    <div class="form-section-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="codigo_barras">Código de Barras</label>
                                <input type="text" id="codigo_barras" name="codigo_barras"
                                    placeholder="Código de barras">
                            </div>
                            <div class="form-group">
                                <label for="lote">Lote</label>
                                <input type="text" id="lote" name="lote" placeholder="Lote">
                            </div>
                            <div class="form-group">
                                <label for="laboratorio">Laboratorio</label>
                                <input type="text" id="laboratorio" name="laboratorio" placeholder="Laboratorio">
                            </div>
                        </div>
                        <div class="form-row" style="margin-top: 16px;">
                            <div class="form-group">
                                <div class="checkbox-group">
                                    <input type="checkbox" id="requiere_receta" name="requiere_receta">
                                    <label for="requiere_receta">Requiere receta médica</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="fecha_vencimiento">Fecha de Vencimiento</label>
                                <input type="date" id="fecha_vencimiento" name="fecha_vencimiento">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg">💾 Guardar Cambios</button>
                    <a href="productos.html" class="btn btn-secondary btn-lg">Cancelar</a>
                </div>
                <div id="mensaje-form" class="mensaje"></div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="js/editar_producto.js"></script>
</body>

</html>

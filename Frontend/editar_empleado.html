<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Empleado — Farmacia</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <span class="brand-icon">💊</span> Farmacia
        </a>
        <button class="navbar-toggle"
            onclick="document.querySelector('.navbar-links').classList.toggle('open')">☰</button>
        <ul class="navbar-links">
            <li><a href="index.html">🏠 Inicio</a></li>
            <li><a href="productos.html">📦 Productos</a></li>
            <li><a href="empleado.html" class="active">👥 Empleados</a></li>
        </ul>
        <div class="navbar-actions">
            <a href="empleado.html" class="btn btn-secondary btn-sm">← Ver Empleados</a>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="page-container">
        <div class="page-header">
            <div>
                <h1>Editar Empleado</h1>
                <p class="breadcrumb"><a href="index.html">Inicio</a> / <a href="empleado.html">Empleados</a> / Editar
                </p>
            </div>
        </div>

        <div class="form-container">
            <form id="form-editar-empleado">
                <!-- Section: Personal Info -->
                <div class="form-section">
                    <div class="form-section-header">
                        <span class="section-icon">👤</span>
                        <h3>Información Personal</h3>
                    </div>
                    <div class="form-section-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nombre">Nombre</label>
                                <input type="text" id="nombre" name="nombre" placeholder="Nombre">
                            </div>
                            <div class="form-group">
                                <label for="apellido">Apellido</label>
                                <input type="text" id="apellido" name="apellido" placeholder="Apellido">
                            </div>
                            <div class="form-group">
                                <label for="cedula">Cédula *</label>
                                <input type="text" id="cedula" name="cedula" placeholder="Cédula" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section: Contact -->
                <div class="form-section">
                    <div class="form-section-header">
                        <span class="section-icon">📧</span>
                        <h3>Contacto</h3>
                    </div>
                    <div class="form-section-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" name="email" placeholder="Email" required>
                            </div>
                            <div class="form-group">
                                <label for="telefono">Teléfono</label>
                                <input type="tel" id="telefono" name="telefono" placeholder="Teléfono">
                            </div>
                            <div class="form-group">
                                <label for="direccion">Dirección</label>
                                <input type="text" id="direccion" name="direccion" placeholder="Dirección">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section: Work -->
                <div class="form-section">
                    <div class="form-section-header">
                        <span class="section-icon">💼</span>
                        <h3>Datos Laborales</h3>
                    </div>
                    <div class="form-section-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cargo">Cargo</label>
                                <input type="text" id="cargo" name="cargo" placeholder="Cargo">
                            </div>
                            <div class="form-group">
                                <label for="salario">Salario</label>
                                <input type="number" step="0.01" min="0" id="salario" name="salario" placeholder="0.00">
                            </div>
                            <div class="form-group">
                                <label for="id_sucursal">ID Sucursal</label>
                                <input type="number" min="1" id="id_sucursal" name="id_sucursal"
                                    placeholder="ID Sucursal">
                            </div>
                        </div>
                        <div class="form-row" style="margin-top: 16px;">
                            <div class="form-group">
                                <label for="fecha_ingreso">Fecha de Ingreso</label>
                                <input type="date" id="fecha_ingreso" name="fecha_ingreso">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg">💾 Guardar Cambios</button>
                    <a href="empleado.html" class="btn btn-secondary btn-lg">Cancelar</a>
                </div>
                <div id="mensaje-form" class="mensaje"></div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="js/editar_empleado.js"></script>
</body>

</html>
